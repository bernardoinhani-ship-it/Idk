name: RDP

on:
  workflow_dispatch:

jobs:
  rdp:
    name: RDP
    runs-on: windows-latest

    steps:
      - name: Testar Windows
        shell: pwsh
        run: |
          Write-Host "RDP workflow funcionando!"
          Write-Host "Computador: $env:COMPUTERNAME"
          Write-Host "Usuário: $env:USERNAME"
          Write-Host "Windows:"
          Get-CimInstance Win32_OperatingSystem |
            Select-Object Caption, Version, OSArchitecture

      - name: Criar arquivo de teste
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force output | Out-Null

          "RDP workflow funcionando em $(Get-Date)" |
            Out-File output\teste.txt -Encoding UTF8

      - name: Enviar arquivo
        uses: actions/upload-artifact@v4
        with:
          name: rdp-output
          path: output/
